# Dockerfile for RK3568 DDR Memory Manager Development Environment
# Interactive development container with all tools and dependencies
# Version: 1.0.0
# Author: Sebastian

FROM ubuntu:22.04

# Set metadata
LABEL maintainer="sebastian@example.com"
LABEL description="RK3568 DDR Memory Manager Development Environment"
LABEL version="1.0.0"

# Set environment variables
ENV DEBIAN_FRONTEND=noninteractive
ENV TZ=UTC
ENV LANG=C.UTF-8
ENV LC_ALL=C.UTF-8
ENV TERM=xterm-256color
ENV DISPLAY=:0
ENV QT_X11_NO_MITSHM=1

# Install base packages
RUN apt-get update && apt-get install -y \
    # Development tools
    build-essential \
    cmake \
    make \
    gcc \
    g++ \
    gdb \
    valgrind \
    lcov \
    # Python
    python3 \
    python3-pip \
    python3-dev \
    python3-venv \
    python3-pyqt5 \
    # Version control
    git \
    git-lfs \
    # Editors
    vim \
    vim-gtk \
    emacs \
    sublime-text \
    # Terminal
    terminator \
    tmux \
    screen \
    # Networking
    curl \
    wget \
    openssh-client \
    sshfs \
    # System tools
    htop \
    iotop \
    iftop \
    nethogs \
    # File management
    mc \
    tree \
    # Visualization
    graphviz \
    dia \
    # Documentation
    doxygen \
    pandoc \
    texlive \
    texlive-latex-extra \
    # Image processing
    imagemagick \
    gimp \
    # Audio
    alsa-utils \
    # GPU
    mesa-utils \
    # Debug
    strace \
    ltrace \
    # Networking
    net-tools \
    iproute2 \
    # Testing
    expect \
    && apt-get clean \
    && rm -rf /var/lib/apt/lists/*

# Install Python development packages
RUN pip3 install --no-cache-dir \
    # Core packages
    ipython \
    jupyter \
    notebook \
    # AI/ML
    tensorflow \
    torch \
    onnx \
    scikit-learn \
    scipy \
    # Visualization
    matplotlib \
    seaborn \
    plotly \
    # Testing
    pytest \
    pytest-xdist \
    pytest-cov \
    coverage \
    # Linting
    flake8 \
    pylint \
    black \
    mypy \
    # Documentation
    sphinx \
    sphinx-autodoc \
    sphinx-rtd-theme \
    recommonmark \
    # Utilities
    pyyaml \
    json5 \
    toml \
    click \
    tqdm \
    pandas \
    numpy

# Install Rockchip tools
RUN git clone https://github.com/rockchip-linux/rkbin.git /opt/rkbin \
    && git clone https://github.com/rockchip-linux/u-boot.git /opt/u-boot \
    && git clone https://github.com/rockchip-linux/kernel.git /opt/kernel \
    && git clone https://github.com/rockchip-linux/rknpu2.git /opt/rknpu2

# Create directories
RUN mkdir -p /workspace /opt/tools /root/.ssh /root/.config

# Set up environment
ENV PATH="/opt/rkbin/tools:/opt/u-boot/tools:/opt/rknpu2/rknn-toolkit2/rknn-toolkit2/packages:$PATH"
ENV CROSS_COMPILE="aarch64-linux-gnu-"
ENV ARCH="arm64"

# Create developer user
RUN useradd -m -u 1000 -s /bin/bash developer \
    && echo "developer ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

# Switch to developer
USER developer
WORKDIR /home/developer

# Set up Git
RUN git config --global user.name "Developer" \
    && git config --global user.email "developer@example.com" \
    && git config --global core.editor "vim"

# Set up Vim
RUN mkdir -p /home/developer/.vim \
    && echo 'syntax on' >> /home/developer/.vimrc \
    && echo 'set number' >> /home/developer/.vimrc \
    && echo 'set tabstop=4' >> /home/developer/.vimrc \
    && echo 'set expandtab' >> /home/developer/.vimrc \
    && echo 'set shiftwidth=4' >> /home/developer/.vimrc \
    && echo 'set autoindent' >> /home/developer/.vimrc \
    && echo 'set smartindent' >> /home/developer/.vimrc \
    && echo 'set wrap' >> /home/developer/.vimrc \
    && echo 'set hlsearch' >> /home/developer/.vimrc \
    && echo 'set incsearch' >> /home/developer/.vimrc \
    && echo 'set ignorecase' >> /home/developer/.vimrc

# Set up aliases
RUN echo '# Custom aliases' >> /home/developer/.bashrc \
    && echo 'alias ll="ls -alF"' >> /home/developer/.bashrc \
    && echo 'alias la="ls -A"' >> /home/developer/.bashrc \
    && echo 'alias l="ls -CF"' >> /home/developer/.bashrc \
    && echo 'alias gs="git status"' >> /home/developer/.bashrc \
    && echo 'alias gp="git pull"' >> /home/developer/.bashrc \
    && echo 'alias gc="git commit"' >> /home/developer/.bashrc \
    && echo 'alias gco="git checkout"' >> /home/developer/.bashrc \
    && echo 'alias gb="git branch"' >> /home/developer/.bashrc \
    && echo 'alias gl="git log --oneline --graph"' >> /home/developer/.bashrc \
    && echo 'alias mk="make"' >> /home/developer/.bashrc \
    && echo 'alias cls="clear"' >> /home/developer/.bashrc \
    && echo 'alias jn="jupyter notebook"' >> /home/developer/.bashrc \
    && echo 'alias jl="jupyter lab"' >> /home/developer/.bashrc

# Default command
CMD ["/bin/bash"]
